<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0284c7" />
      <stop offset="50%" stopColor="#0369a1" />
      <stop offset="100%" stopColor="#0f172a" />
    </linearGradient>
    <linearGradient id="favWaterGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#7dd3fc" />
    </linearGradient>
    <linearGradient id="favGoldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fbbf24" />
      <stop offset="100%" stopColor="#f59e0b" />
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#favBgGradient)" />
  <rect x="4" y="4" width="92" height="92" rx="26" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />

  <!-- Living Water Streams -->
  <path d="M20 74 C 28 66, 36 68, 44 60 C 48 56, 48 46, 44 38 C 42 34, 38 32, 34 35" stroke="url(#favWaterGradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M80 74 C 72 66, 64 68, 56 60 C 52 56, 52 46, 56 38 C 58 34, 62 32, 66 35" stroke="url(#favWaterGradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M28 80 C 40 73, 60 73, 72 80" stroke="url(#favWaterGradient)" stroke-width="4" stroke-linecap="round" />

  <!-- Holy Cross -->
  <rect x="45.5" y="16" width="9" height="52" rx="4" fill="#ffffff" />
  <rect x="32" y="31" width="36" height="9" rx="4" fill="#ffffff" />

  <!-- Center Golden Faith Core -->
  <circle cx="50" cy="35.5" r="5" fill="url(#favGoldAccent)" />
  <circle cx="50" cy="35.5" r="2.2" fill="#ffffff" />
